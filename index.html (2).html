.q{font-size:22px;line-height:1.4;text-align:center;margin:6px 0 12px}
.tag{text-align:center;color:var(--acc);font-size:13px;letter-spacing:2px}

.line{min-height:54px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;margin:8px 0}
.tile{padding:10px 13px;border-radius:10px;border:2px solid var(--acc);background:#243244;font-size:19px}
.row{display:flex;gap:8px}.row .opt{text-align:center;font-size:36px}.row small{display:block;font-size:14px}
.fb{margin-top:10px;padding:10px;border-radius:12px;background:#0d1219;border:2px solid var(--line);font-family:Verdana,sans-serif;font-weight:bold;font-size:16px}
.feed{color:var(--mut);font-weight:normal;font-size:13px;margin-top:4px}
.main{background:var(--acc);color:#111;border:0;border-radius:12px;padding:13px 22px;font-size:18px;margin-top:10px}
.mute{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);background:var(--card);border:2px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:18px}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.center{text-align:center}.huge{font-size:60px}

const $=id=>document.getElementById(id),app=$('app'),sh=a=>[...a].sort(()=>Math.random()-.5),rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const NM=["Ninja","Tiger","Pixel","Rocket","Panda","Falcon","Zed","Mango"];
// ---- music: chill modern lo-fi pop loop (~100 BPM) ----
let ac,mg,lp,nb,on=true,stp=0,tm1;
const CH=[[220,261.6,329.6,392],[174.6,220,261.6,329.6],[261.6,329.6,392,493.9],[196,246.9,293.7,392]],RT=[110,87.3,130.8,98],PEN=[523.25,587.33,659.25,783.99,880],PT=[0,-1,2,-1,4,-1,2,0,-1,-1,3,-1,2,-1,-1,-1];
function nt(f,d,ty,v,f2,at){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(at||0);o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.03,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(lp);o.start(t);o.stop(t+d+.05)}
function nz(d,v,hp){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(lp);s.start(t);s.stop(t+d)}
function tick(){if(!on)return;const n=stp++%64,bar=n>>4,s=n%16;
 if(s===0)CH[bar].forEach((f,k)=>nt(f,2,'triangle',.05,0,k*.02));
 if(s%4===0)nt(120,.2,'sine',.36,42);
 if(s===4||s===12)nz(.12,.09,1800);
 if(s%2===1)nz(.04,.03,7000);if(s===2||s===6||s===10||s===14)nt(CH[bar][2]*2,.12,'square',.015);
 if(s===0||s===6||s===8||s===11)nt(RT[bar],.35,'sine',.26);
 if(PT[s]>=0){const f=PEN[(PT[s]+bar)%5];nt(f,.35,'triangle',.12);nt(f*2,.2,'sine',.03)}}
function mus(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.6;mg.connect(ac.destination);
 lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3000;lp.connect(mg);
 const dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.27;fb.gain.value=.3;wet.gain.value=.22;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(mg);
 nb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 ac.resume();if(!tm1)tm1=setInterval(tick,150)}catch(e){}}
function sfx(ok){if(!ac||!on)return;if(ok){nt(784,.25,'sine',.2);nt(1175,.35,'sine',.18,0,.1)}else nt(220,.4,'triangle',.2,130)}
$('mu').onclick=()=>{on=!on;$('mu').textContent=on?'🔊':'🔇';if(on)mus()};
// ---- screens ----
let S;
const SEC={1:"Section 1 · Units 1–5",2:"Section 2 · Units 6–9"};
function home(){clearInterval(S&&S.iv);
 app.innerHTML=`<h1>🪂 GRAMMAR ROYALE</h1><p class="sub">Solutions Elementary · 100 players drop in. Be the last one standing!</p>${stats()}`+
 [1,2].map(n=>`<button class="zone big" data-m="S${n}">⚔️ BATTLE · ${SEC[n]}</button>`+Object.keys(Z).sort().filter(k=>Z[k].s===n).map(k=>`<button class="zone" data-m="${k}">${Z[k].i} ${Z[k].n}<small>${Z[k].d}</small></button>`).join('')).join('<p class="sub" style="margin-top:14px">— — —</p>');
 document.querySelectorAll('.zone').forEach(b=>b.onclick=()=>{mus();go(b.dataset.m)})}
function go(m){const all=Object.values(Z).filter(z=>m==='S'+z.s).flatMap(z=>z.q);
 S={m,l:draw(m,all),i:0,xp:0,hp:100,sd:0,al:100,cb:0,best:0,ok:0,lock:false};round()}
function hud(){return `<div class="hud"><span class="pill">👥 ${S.al}</span><div class="hp"><i style="width:${S.hp}%"></i></div><span class="pill">🛡️${S.sd}</span><span class="pill">🔥${S.cb}</span><span class="pill">⭐${S.xp}</span></div><div class="zt"><i id="tb"></i></div>`}
function round(){
 if(S.i>=S.l.length||S.hp<=0)return end();
 S.lock=false;const d=S.l[S.i],t=d[0];let b='';
 const tag=`<div class="tag">ZONE ${S.i+1}/${S.l.length}</div>`;
 if(t==='=')b=`${tag}<div class="q">Build the sentence!</div><div class="line" id="ln"></div><div class="line" id="tl" style="border:0"></div>`;
 else if(t==='~')b=`${tag}<div class="q">Sort it: <b style="color:var(--acc)">${d[1]}</b></div><div id="op"></div>`;
 else if(t==='_')b=`${tag}<div class="q">Spell it! ✍️</div><div class="q" style="font-size:19px">${d[1].replace('___','<b style="color:var(--acc)">_____</b>')}</div><div class="line" id="ln"></div><div class="line" id="tl" style="border:0"></div>`;
 else if(t==='!')b=`${tag}<div class="q">Find the mistake! 🔎</div><div class="line" id="ln" style="border:0"></div>`;
 else if(t==='?')b=`${tag}<div class="q">Odd one out!</div><div id="op"></div>`;
 else if(t==='^')b=`${tag}<div class="q">${d[1]}</div><div class="row" id="op"></div>`;
 else b=`${tag}<div class="q">${d[0].replace('___','<b style="color:var(--acc)">_____</b>')}</div><div id="op"></div>`;
 app.innerHTML=hud()+`<div class="card" id="cd">${b}<div id="fb"></div></div>`;
 const H={'=':bld,'~':srt,'^':pic,'!':mis,'?':odd,'_':spl};(H[t]||cho)(d);
 clearInterval(S.iv);S.t=20;S.iv=setInterval(()=>{S.t-=.1;const e=$('tb');if(e)e.style.width=S.t*5+'%';if(S.t<=0&&!S.lock)fin(0,S.ans)},100)}
function btn(txt,cls,fn){const x=document.createElement('button');x.className=cls;x.innerHTML=txt;x.onclick=()=>{if(!S.lock)fn(x)};return x}
function opts(arr,ans,sen,cls){const o=$('op');const L=sh(arr.map((v,k)=>({v,k})));S.ans=sen;
 L.forEach(x=>{const b=btn(x.v,cls,b=>{b.classList.add(x.k===ans?'ok':'bad');if(x.k!==ans)[...o.children].forEach((c,n)=>{if(L[n].k===ans)c.classList.add('ok')});fin(x.k===ans,sen)});o.appendChild(b)})}
function spl(d){const w=d[2],ln=$('ln'),tl=$('tl'),pl=[];let pool=sh([...w.slice(1)].map((v,k)=>({v,k})));S.ans=d[1].replace('___',w);
 const mk=v=>{const b=document.createElement('button');b.className='tile';b.textContent=v;return b};
 const draw=()=>{ln.innerHTML='';tl.innerHTML='';const f=mk(w[0]);f.style.opacity=.6;ln.appendChild(f);
  pl.forEach((x,n)=>{const b=mk(x.v);b.onclick=()=>{if(S.lock)return;pool.push(pl.splice(n,1)[0]);draw()};ln.appendChild(b)});
  pool.forEach(x=>{const b=mk(x.v);b.onclick=()=>{if(S.lock)return;pl.push(pool.splice(pool.indexOf(x),1)[0]);draw();
   if(!pool.length){const ok=w[0]+pl.map(y=>y.v).join('')===w;if(ok)ln.querySelectorAll('.tile').forEach(t=>t.classList.add('ok'));fin(ok,S.ans)}};tl.appendChild(b)})};draw()}
function mis(d){const ln=$('ln'),cl=x=>x.replace(/[.,?!]/g,'');S.ans=d[3];
 d[1].split(' ').forEach(w=>ln.appendChild(btn(w,'tile',b=>{const ok=cl(w)===d[2];b.classList.add(ok?'ok':'bad');
  if(!ok)[...ln.children].forEach(c=>{if(cl(c.textContent)===d[2])c.classList.add('ok')});fin(ok,d[3])})))}
function odd(d){opts(d[1].split('|'),0,d[2],'opt')}
function cho(d){const o=d[1].split('|');opts(o,0,d[0].replace('___',o[0]),'opt')}
function srt(d){S.ans=d[1]+' is '+['countable (apples, tomatoes...)','uncountable (no plural: beef, pasta, cheese...)'][d[2]];
 const o=$('op');['🍓 Countable','🧀 Uncountable'].forEach((t,k)=>o.appendChild(btn(t,'opt',b=>{b.classList.add(k===d[2]?'ok':'bad');fin(k===d[2],S.ans)})))}
function pic(d){const o=d[2].split('|');S.ans=d[3];const L=sh(o.map((v,k)=>({v,k})));
 L.forEach(x=>{const p=x.v.split(' ');const b=btn(p[0]+'<small>'+p.slice(1).join(' ')+'</small>','opt',b=>{b.classList.add(x.k===0?'ok':'bad');if(x.k)[...$('op').children].forEach((c,n)=>{if(L[n].k===0)c.classList.add('ok')});fin(x.k===0,d[3])});$('op').appendChild(b)})}
function bld(d){const w=d[1].split(' '),pl=[],ln=$('ln'),tl=$('tl');let pool=sh(w.map((v,k)=>({v,k})));S.ans=d[1];
 const mk=v=>{const b=document.createElement('button');b.className='tile';b.textContent=v;return b};
 const draw=()=>{ln.innerHTML='';tl.innerHTML='';
  pl.forEach((x,n)=>{const b=mk(x.v);b.onclick=()=>{if(S.lock)return;pool.push(pl.splice(n,1)[0]);draw()};ln.appendChild(b)});
  pool.forEach(x=>{const b=mk(x.v);b.onclick=()=>{if(S.lock)return;pl.push(pool.splice(pool.indexOf(x),1)[0]);draw();
   if(!pool.length){const ok=pl.map(y=>y.v).join(' ')===d[1];if(ok)ln.querySelectorAll('.tile').forEach(t=>t.classList.add('ok'));fin(ok,d[1])}};tl.appendChild(b)})};draw()}
function fin(ok,sen){
 S.lock=true;clearInterval(S.iv);let msg='';
 if(ok){S.cb++;S.ok++;S.best=Math.max(S.best,S.cb);S.xp+=10*Math.min(S.cb,5);S.al=Math.max(1,S.al-rn(7,11));sfx(1);
  if(S.cb%3===0){const r=rn(0,1);if(r){S.sd++;msg='📦 Loot crate: +1 🛡️ Shield!'}else{S.hp=Math.min(100,S.hp+25);msg='📦 Loot crate: +25 ❤️ Health!'}}}
 else{S.cb=0;S.al=Math.max(1,S.al-rn(1,3));sfx(0);$('cd').classList.add('shake');
  if(S.sd>0){S.sd--;msg='🛡️ Shield saved you!'}else S.hp-=25}
 const f=`${NM[rn(0,7)]}${rn(10,99)} left the zone 🌀`;
 $('fb').innerHTML=`<div class="fb">${ok?'✅ Nice!':'❌ The answer:'} ${sen}<br>🗣️ Say it out loud!<div class="feed">${msg?msg+'<br>':''}${f}</div></div><button class="main" id="nx">${S.i<S.l.length-1&&S.hp>0?'NEXT ➜':'FINISH'}</button>`;
 $('nx').onclick=()=>{S.i++;round()}}
function end(){clearInterval(S.iv);const r=S.hp>0?Math.max(1,S.al):S.al,w=r===1;T.xp+=S.xp;T.g++;T.ok+=S.ok;T.n+=S.i;T.best=T.best?Math.min(T.best,r):r;
 app.innerHTML=`<div class="card center"><div class="huge">${w?'🏆':r<=10?'🥇':S.hp>0?'🎖️':'💔'}</div><h1>${w?'#1 CHAMPION!':r<=10?'TOP 10!':S.hp>0?'You survived!':'Eliminated'}</h1>
 <p style="font-size:26px">Rank <b style="color:var(--acc)">#${r}</b> / 100</p><p class="sub">Correct: ${S.ok}/${S.l.length} · Best streak 🔥${S.best} · XP ⭐${S.xp}</p><p class="sub">Overall: ⭐${T.xp} XP · Level ${Math.floor(T.xp/200)+1}</p>
 <button class="main" id="a1">DROP AGAIN</button> <button class="main" id="a2">MENU</button></div>`;
 $('a1').onclick=()=>go(S.m);$('a2').onclick=home}
home();
</script></body></html>
